<title>Open Imaging Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: reading-room console. Home = atlas index (area, modality, region cards).
   Study = structure dock left, 2x2 film box centre, case card right. */
:root {
  --bg: #e9ecee; --panel: #f7f8f9; --panel-2: #dfe3e6; --line: #c5ccd2;
  --fg: #1a2026; --muted: #5a6670; --accent: #1f6a86; --accent-ink: #ffffff;
  --cross: #f0a92e; --film: #050607; --film-ink: #d7dde2;
  --good: #2f7d4f; --bad: #b23b3b; --lesion: #36e0b0;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1114; --panel: #151b20; --panel-2: #1d252c; --line: #2b353e;
    --fg: #e3e8ec; --muted: #8d9aa5; --accent: #5fb3d1; --accent-ink: #061218;
    --good: #5cc28a; --bad: #e57373; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1114; --panel: #151b20; --panel-2: #1d252c; --line: #2b353e;
  --fg: #e3e8ec; --muted: #8d9aa5; --accent: #5fb3d1; --accent-ink: #061218;
  --good: #5cc28a; --bad: #e57373; color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--f-body); padding-inline: 16px; padding-block: 0 16px; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; padding-block: 14px 10px; border-bottom: 1px solid var(--line); }
.brand { font: 700 22px/1.1 var(--f-display); letter-spacing: .01em; margin: 0; cursor: pointer; background: none; border: 0; padding: 0; }
.brand span { color: var(--accent); }
.dataset { color: var(--muted); font-size: 12.5px; margin: 0; min-width: 0; }

/* ---------- home ---------- */
.home { display: grid; gap: 16px; padding-top: 16px; }
.areas { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.area-tabs { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.area-tabs button { border: 0; background: var(--panel); padding: 8px 16px; cursor: pointer; font: 600 15px/1.2 var(--f-display); letter-spacing: .02em; }
.area-tabs button + button { border-left: 1px solid var(--line); }
.area-tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.mods { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.intro { margin: 0; color: var(--muted); max-width: 75ch; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.card-s { display: grid; grid-template-rows: auto 1fr; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); overflow: hidden; cursor: pointer; padding: 0; }
.card-s:hover { border-color: var(--accent); }
.card-s img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; background: #000; }
.card-s .body { padding: 10px 12px 12px; display: grid; gap: 4px; align-content: start; }
.badge { justify-self: start; font: 600 10.5px/1 var(--f-display); letter-spacing: .09em; text-transform: uppercase; color: var(--accent); }
.card-s h3 { margin: 0; font: 700 17px/1.2 var(--f-display); }
.card-s p { margin: 0; color: var(--muted); font-size: 12.5px; }
.facts { font: 500 11.5px var(--f-mono); color: var(--muted); }
.empty { color: var(--muted); }

/* ---------- workspace ---------- */
.wsbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding-block: 10px; border-bottom: 1px solid var(--line); }
.wsbar h2 { margin: 0; font: 700 19px/1.1 var(--f-display); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding-block: 10px; border-bottom: 1px solid var(--line); }
.tgroup { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tlabel { font: 600 11px/1 var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 5px 10px; cursor: pointer; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
input[type=range] { width: 110px; accent-color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 5px 11px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.check { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; cursor: pointer; }

.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr) 300px; gap: 14px; padding-top: 14px; align-items: start; }
@media (max-width: 1150px) { .layout { grid-template-columns: 230px minmax(0, 1fr); } .card { grid-column: 1 / -1; } }
@media (max-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr); } .index { order: 3; } .card { order: 2; } }
.layout.noindex { grid-template-columns: minmax(0, 1fr) 300px; }
@media (max-width: 760px) { .layout.noindex { grid-template-columns: minmax(0, 1fr); } }
.index { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; max-height: calc(100vh - 170px); min-height: 280px; }
.index input[type=search] { margin: 10px; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); }
.list { overflow-y: auto; padding: 0 4px 10px; min-height: 0; }
.ghead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 8px 4px; position: sticky; top: 0; background: var(--panel); z-index: 1; }
.ghead h3 { margin: 0; font: 600 11.5px/1 var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.ghead label { font-size: 11.5px; color: var(--muted); display: flex; gap: 4px; align-items: center; cursor: pointer; }
.sub { margin: 8px 8px 2px; font: italic 500 11.5px/1.2 var(--f-body); color: var(--muted); }
.item { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; }
.item:hover { background: var(--panel-2); }
.item[aria-current="true"] { background: var(--panel-2); box-shadow: inset 2px 0 var(--accent); }
.item.off .nm { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.sw { width: 12px; height: 12px; border-radius: 3px; }
.nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hm { font: 500 11px var(--f-mono); color: var(--muted); }

.films { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; background: var(--film); padding: 6px; border-radius: var(--r); }
.films.single { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 460px) { .films { grid-template-columns: minmax(0, 1fr); } }
.pane { position: relative; aspect-ratio: 1 / 1; max-width: 100%; background: #000; overflow: hidden; touch-action: none; border-radius: 3px; }
.films.single .pane { aspect-ratio: 4 / 5; max-height: 78vh; }
@media (pointer: coarse) { .pane[data-plane] { touch-action: pan-y; } }
.pane canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
.pane.three canvas { cursor: grab; }
.tag { position: absolute; pointer-events: none; color: var(--film-ink); font: 500 11.5px/1.2 var(--f-mono); background: rgba(0,0,0,.6); padding: 2px 5px; border-radius: 3px; }
.tag:empty { display: none; }
.tag.tl { top: 7px; left: 9px; font: 600 12px/1.2 var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
.tag.br { bottom: 7px; right: 9px; }
.tag.bl { bottom: 7px; left: 9px; color: #9aa7b1; }
.ori { position: absolute; pointer-events: none; color: var(--cross); font: 600 12px var(--f-mono); text-shadow: 0 0 3px #000, 0 1px 2px #000; }
.ori.l { left: 6px; top: 50%; transform: translateY(-50%); }
.ori.r { right: 6px; top: 50%; transform: translateY(-50%); }
.ori.t { top: 6px; left: 50%; transform: translateX(-50%); }
.ori.b { bottom: 6px; left: 50%; transform: translateX(-50%); }
.tip { position: absolute; pointer-events: none; background: #0b0f12e6; color: #eef2f5; border: 1px solid #36424c; border-radius: 4px; padding: 4px 7px; font-size: 12px; white-space: nowrap; transform: translate(12px, 12px); z-index: 2; }
.pane-ctl { position: absolute; right: 8px; top: 6px; display: flex; gap: 6px; align-items: center; color: var(--film-ink); font-size: 11.5px; z-index: 2; }
.pane-ctl input[type=range] { width: 80px; accent-color: var(--cross); }
.pane-ctl .seg { border-color: #36424c; }
.pane-ctl .seg button { background: #11171c; color: #cfd6dc; padding: 3px 8px; font-size: 11.5px; }
.pane-ctl .seg button[aria-pressed="true"] { background: var(--cross); color: #111; }
.hint { color: var(--muted); font-size: 12px; margin: 8px 2px 0; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--film-ink); font: 500 13px var(--f-mono); text-align: center; padding: 20px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font: 700 20px/1.15 var(--f-display); text-wrap: balance; }
.card h4 { margin: 4px 0 0; font: 600 12px/1 var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.eyebrow { font: 600 11px/1 var(--f-display); text-transform: uppercase; letter-spacing: .09em; color: var(--accent); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; margin: 0; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--f-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.note { margin: 0; font-size: 13.5px; }
.small { margin: 0; font-size: 12px; color: var(--muted); }
.card ul { margin: 0; padding-left: 18px; font-size: 13px; display: grid; gap: 4px; }
.readout { font: 500 12.5px var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.readout b { color: var(--fg); font-weight: 500; }
.ltable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.ltable th { text-align: left; font: 600 11px var(--f-display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 4px 4px; border-bottom: 1px solid var(--line); }
.ltable td { padding: 4px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.ltable td.n { font-family: var(--f-mono); text-align: right; }
.ltable tr { cursor: pointer; }
.ltable tr:hover td { background: var(--panel-2); }
.ltable tr[aria-current="true"] td { background: var(--panel-2); box-shadow: inset 0 -1px var(--accent); }
.scroll { overflow-x: auto; max-height: 260px; overflow-y: auto; }
.quiz .choices { display: grid; gap: 6px; }
.quiz .choices button { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: var(--r); padding: 8px 10px; cursor: pointer; }
.quiz .choices button:hover:not(:disabled) { border-color: var(--accent); }
.quiz .choices button.right { border-color: var(--good); color: var(--good); font-weight: 600; }
.quiz .choices button.wrong { border-color: var(--bad); color: var(--bad); }
.score { font: 500 12.5px var(--f-mono); color: var(--muted); margin: 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
footer { margin-top: 22px; color: var(--muted); font-size: 12px; max-width: 90ch; }
footer p { margin: 4px 0; }
footer a, .card a { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <button type="button" class="brand" id="home-link">Open <span>Imaging Atlas</span></button>
  <p class="dataset">Anatomy and pathology on real, openly licensed scans · CT, PET-CT, MRI, ultrasound and radiographs</p>
</header>
<main id="app"></main>
<footer id="foot"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ======================= catalogue ======================= */
const CATALOG = [
  { id: 'ct-body', area: 'anatomy', mod: 'CT', title: 'Whole body', sub: 'Contrast-enhanced CT, base of skull to feet', study: 'ct_neg', thumb: 'ct_neg', facts: '107 structures · 2 × 2 × 2.5 mm' },
  { id: 'xr-body', area: 'anatomy', mod: 'X-ray', title: 'Chest, abdomen and pelvis', sub: 'Radiographs reconstructed from the whole-body CT', study: 'ct_neg', view: 'xray', thumb: 'xray', facts: 'AP and lateral · projected labels' },
  { id: 'mr-brain', area: 'anatomy', mod: 'MRI', title: 'Brain', sub: 'T1 and T2, ICBM 152 average template', study: 'brain', thumb: 'brain', facts: '100 structures · 1 mm' },
  { id: 'mr-prostate', area: 'anatomy', mod: 'MRI', title: 'Prostate', sub: 'T2-weighted axial, gland outlined by a radiologist', study: 'prostate', thumb: 'prostate', facts: 'Gland 48 mL · 0.66 × 0.66 × 1.5 mm' },
  { id: 'us-prostate', area: 'anatomy', mod: 'Ultrasound', title: 'Prostate, transrectal', sub: '3D endocavitary ultrasound volume', study: 'trus', thumb: 'trus', facts: '0.7 mm · unlabelled reading' },
  { id: 'case-lymphoma', area: 'pathology', mod: 'CT', badge: 'PET-CT', title: 'Lymphoma', sub: 'FDG PET-CT, extensive skeletal disease', study: 'ct_lym', thumb: 'case_lym', facts: '235 segmented lesions · SUVmax 31.5' },
  { id: 'case-lung', area: 'pathology', mod: 'CT', badge: 'PET-CT', title: 'Lung cancer', sub: 'FDG PET-CT with nodal and bone disease', study: 'ct_lung', thumb: 'case_lung', facts: '67 segmented lesions · SUVmax 12.4' },
  { id: 'case-prostate', area: 'pathology', mod: 'MRI', title: 'Prostate biopsy target', sub: 'T2 MRI, suspicious lesion targeted at fusion biopsy', study: 'prostate', thumb: 'case_prostate', focus: 2, facts: 'Target 0.9 mL' },
];
const MODS = ['All', 'X-ray', 'CT', 'MRI', 'Ultrasound'];

const CASES = {
  'case-lymphoma': {
    dx: 'Lymphoma (dataset diagnosis label)',
    intro: 'FDG PET-CT from a staging or restaging examination. The dataset experts outlined every FDG-avid lesion; this page measures them. Most of the volume sits in the skeleton: the pelvis, spine and proximal femora.',
    points: [
      'FDG PET-CT is the reference staging test for FDG-avid lymphomas such as Hodgkin lymphoma and diffuse large B-cell lymphoma (Lugano classification).',
      'Treatment response is scored with the Deauville five-point scale, which compares residual uptake with the mediastinal blood pool and the liver.',
      'Focal bone or marrow uptake on PET can show marrow involvement that a CT window alone misses; compare the bone window with the PET overlay here.',
      'Normal FDG uptake to recognise: brain, myocardium (variable), kidneys and bladder (excretion), bowel and brown fat.',
    ],
  },
  'case-lung': {
    dx: 'Lung cancer (dataset diagnosis label)',
    intro: 'FDG PET-CT in a patient with lung cancer. Outlined lesions include a left upper lobe lesion, mediastinal uptake next to the aorta and multiple bone lesions.',
    points: [
      'PET-CT is used to stage non-small cell lung cancer, mainly to find nodal (N) and distant (M) disease that changes treatment.',
      'FDG-avid mediastinal nodes usually need tissue confirmation (EBUS or mediastinoscopy) when the result would change management.',
      'False positives: infection, inflammation and granulomatous disease. False negatives: lesions under about 8 mm, some adenocarcinomas and carcinoid.',
      'Common metastatic sites are bone, adrenal glands, liver and brain. FDG assesses the brain poorly because normal cortex is intensely avid.',
    ],
  },
  'case-prostate': {
    dx: 'Suspicious lesion targeted at MRI/ultrasound fusion biopsy',
    intro: 'T2-weighted MRI with the gland and the biopsy target outlined by the study radiologist. The biopsy result for this target is not published with the images, so it is not shown here.',
    points: [
      'Multiparametric prostate MRI is reported with PI-RADS v2.1. Diffusion is the dominant sequence in the peripheral zone, T2 in the transition zone.',
      'About 70% of prostate cancers arise in the peripheral zone, which lies posteriorly next to the rectum.',
      'Cancer on T2 is typically a homogeneous, moderately low-signal area; in the peripheral zone it stands out against the normally bright background.',
      'Fusion biopsy overlays the MRI target on live transrectal ultrasound, the probe you can explore in the ultrasound module.',
    ],
  },
};

const STUDY_INFO = {
  ct_neg: { kind: 'ct', note: 'Whole-body contrast-enhanced CT from an FDG PET-CT exam with no lesions found (control case). Organ, vessel, bone and muscle labels were generated with TotalSegmentator, an open segmentation model, so small structures and edges can be imperfect.' },
  ct_lym: { kind: 'ct' }, ct_lung: { kind: 'ct' },
  brain: { kind: 'mr', note: 'Population-average brain (ICBM 152 2009c). Labels: FreeSurfer-style segmentation and DKT cortical parcellation distributed with the template.' },
  prostate: { kind: 'mr', note: 'T2-weighted axial MRI from the Prostate-MRI-US-Biopsy collection. Outlines were drawn by the study radiologist.' },
  trus: { kind: 'us', note: '3D transrectal ultrasound volume reconstructed by the fusion-biopsy system. The file does not record anatomical orientation, so the planes are named by their relation to the probe. Note the probe at the top of each through-probe plane.' },
};

const CT_WIN = { 'Soft tissue': [40, 400], 'Lung': [-600, 1500], 'Bone': [400, 1800], 'Liver': [60, 160], 'Mediastinum': [50, 350] };
const BYTE_WIN = {
  brain: { t1: { Standard: [30, 265], 'High contrast': [130, 250] }, t2: { Standard: [20, 265], 'High contrast': [80, 210] } },
  prostate: { t2: { Standard: [0, 240], 'High contrast': [40, 190] } },
  trus: { us: { Standard: [0, 255], Bright: [0, 170], Dark: [40, 255] } },
};
const HEMI = { L: 'Left', R: 'Right', M: 'Midline' };
const GROUP_HIDDEN = { ct: ['Muscles'], mr: [] };
const HIDDEN_NAMES = ['Cerebral white matter', 'Extracerebral CSF'];

/* ======================= data loading ======================= */
const CACHE = {};
async function decodePart(path, n) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(path + ' ' + res.status);
  const bmp = await createImageBitmap(await res.blob(), { colorSpaceConversion: 'none', premultiplyAlpha: 'none' });
  const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
  const ctx = c.getContext('2d', { willReadFrequently: true }); ctx.drawImage(bmp, 0, 0);
  const px = ctx.getImageData(0, 0, bmp.width, bmp.height).data;
  const out = new Uint8Array(n);
  for (let i = 0; i < n; i++) out[i] = px[i * 4];
  return out;
}
async function payload(dir, entry) {
  const parts = await Promise.all(entry.parts.map((p) => decodePart(dir + '/' + p.file, p.bytes)));
  const out = new Uint8Array(entry.bytes); let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  let a = 1, b = 0;
  for (let i = 0; i < out.length; i++) { a = (a + out[i]) % 65521; b = (b + a) % 65521; }
  if (((b << 16) | a) >>> 0 !== entry.adler32) throw new Error('checksum mismatch in ' + dir);
  return out;
}
async function loadStudy(id, want, progress) {
  const dir = 'data/' + id;
  const c = CACHE[id] || (CACHE[id] = { dir, bufs: {} });
  if (!c.meta) c.meta = await (await fetch(dir + '/meta.json')).json();
  const need = want.filter((n) => c.meta.files[n] && !c.bufs[n]);
  let done = 0;
  await Promise.all(need.map(async (n) => {
    c.bufs[n] = await payload(dir, c.meta.files[n]);
    done++; if (progress) progress(done, need.length);
  }));
  return c;
}

/* ======================= routing ======================= */
const APP = { area: 'anatomy', mod: 'All', entry: null };
let W = null; // current workspace
function goHome() { teardown(); APP.entry = null; renderHome(); window.scrollTo(0, 0); }
function openEntry(e) { teardown(); APP.entry = e; e.view === 'xray' ? openXray(e) : openVolume(e); window.scrollTo(0, 0); }
$('#home-link').addEventListener('click', goHome);
function teardown() {
  if (W && W.dispose) W.dispose();
  W = null;
}

function renderHome() {
  const app = $('#app');
  const list = CATALOG.filter((e) => e.area === APP.area && (APP.mod === 'All' || e.mod === APP.mod));
  app.innerHTML = `<section class="home">
    <div class="areas">
      <div class="area-tabs" role="group" aria-label="Area">
        <button type="button" data-a="anatomy" aria-pressed="${APP.area === 'anatomy'}">Anatomy</button>
        <button type="button" data-a="pathology" aria-pressed="${APP.area === 'pathology'}">Pathology</button>
      </div>
      <div class="mods" role="group" aria-label="Modality">${MODS.map((m) => `<button type="button" class="chip" data-m="${m}" aria-pressed="${APP.mod === m}">${m}</button>`).join('')}</div>
    </div>
    <p class="intro">${APP.area === 'anatomy'
      ? 'Pick a region to open it in the reading workspace: linked planes, window presets, labelled structures, a 3D reference and a naming quiz.'
      : 'Real cases with expert lesion outlines. Each case opens with the lesions measured from the data and a short set of teaching points.'}</p>
    <div class="cards">${list.length ? list.map((e) => `
      <button type="button" class="card-s" data-id="${e.id}">
        <img src="thumbs/${e.thumb}.png" alt="" loading="lazy" width="360" height="360">
        <span class="body"><span class="badge">${esc(e.badge || e.mod)}</span><h3>${esc(e.title)}</h3><p>${esc(e.sub)}</p><span class="facts">${esc(e.facts)}</span></span>
      </button>`).join('') : '<p class="empty">Nothing in this modality yet. Try another tab.</p>'}</div>
  </section>`;
  app.querySelectorAll('[data-a]').forEach((b) => b.addEventListener('click', () => { APP.area = b.dataset.a; renderHome(); }));
  app.querySelectorAll('[data-m]').forEach((b) => b.addEventListener('click', () => { APP.mod = b.dataset.m; renderHome(); }));
  app.querySelectorAll('.card-s').forEach((b) => b.addEventListener('click', () => openEntry(CATALOG.find((e) => e.id === b.dataset.id))));
}

/* ======================= volume workspace ======================= */
function openVolume(entry) {
  const sid = entry.study, info = STUDY_INFO[sid], kind = info.kind;
  const isCase = entry.area === 'pathology';
  const hasPet = sid === 'ct_lym' || sid === 'ct_lung';
  const app = $('#app');
  app.innerHTML = `
    <div class="wsbar"><button type="button" class="btn" id="back">← Atlas</button><span class="badge">${esc(entry.badge || entry.mod)}</span><h2>${esc(entry.title)}</h2></div>
    <div class="toolbar" id="tb" role="toolbar" aria-label="Viewer settings"></div>
    <div class="layout">
      <nav class="index" aria-label="Structures"><input type="search" id="search" placeholder="Find a structure…" aria-label="Find a structure"><div class="list" id="list"></div></nav>
      <section aria-label="Image planes">
        <div class="films">
          <div class="pane" data-plane="axial"><canvas></canvas><span class="tag tl"></span><span class="tag br"></span><span class="ori l"></span><span class="ori r"></span><span class="ori t"></span><span class="ori b"></span><div class="loading" id="loading">Loading…</div></div>
          <div class="pane" data-plane="coronal"><canvas></canvas><span class="tag tl"></span><span class="tag br"></span><span class="ori l"></span><span class="ori r"></span><span class="ori t"></span><span class="ori b"></span></div>
          <div class="pane" data-plane="sagittal"><canvas></canvas><span class="tag tl"></span><span class="tag br"></span><span class="ori l"></span><span class="ori r"></span><span class="ori t"></span><span class="ori b"></span></div>
          <div class="pane three" id="pane4"><span class="tag tl" id="p4title">3D</span><div class="pane-ctl" id="p4ctl"></div><span class="tag bl" id="p4hint"></span></div>
        </div>
        <p class="hint">Click or drag on a plane to move the crosshair. Scroll on a plane to page through slices. Hover to read a label.</p>
      </section>
      <aside class="card" id="card" aria-live="polite"></aside>
    </div>`;
  $('#back').addEventListener('click', goHome);

  const S = W = {
    entry, sid, kind, isCase, hasPet, pos: [0, 0, 0], conv: 'radio', selected: null, lesionSel: null,
    visible: new Uint8Array(256), quiz: null, score: { right: 0, total: 0 }, fusion: hasPet ? 0.6 : 0, showLesions: true,
    p4: hasPet ? 'mip' : '3d', opacity: hasPet ? 0 : 0.4, seq: null, win: null, hovered: null, disposed: false, three: null,
    dispose() { this.disposed = true; if (this.three) this.three.dispose(); if (this.ro) this.ro.disconnect(); },
  };
  const want = { ct: ['ct', 'labels', 'meshes'], mr: [], us: ['us'] }[kind].slice();
  if (sid === 'brain') want.push('t1', 't2', 'labels', 'meshes');
  if (sid === 'prostate') want.push('t2', 'labels', 'meshes');
  if (hasPet) want.push('pet', 'lesions', 'lesion_meshes');
  loadStudy(sid, want, (d, n) => { const l = $('#loading'); if (l) l.textContent = `Loading image data… ${d} of ${n}`; })
    .then((c) => { if (!S.disposed) startVolume(S, c); })
    .catch((err) => { console.error(err); const l = $('#loading'); if (l) l.textContent = 'Could not load this study. Go back and open it again.'; });
}

function startVolume(S, c) {
  const m = S.meta = c.meta; S.c = c;
  S.dims = m.dims; S.sp = m.spacing;
  S.structs = m.structures; S.byId = {}; S.structs.forEach((s) => (S.byId[s.id] = s));
  const hiddenGroups = GROUP_HIDDEN[S.kind] || [];
  S.structs.forEach((s) => (S.visible[s.id] = hiddenGroups.includes(s.group) || HIDDEN_NAMES.includes(s.name) ? 0 : 1));
  S.labels = c.bufs.labels || null;
  S.lesions = c.bufs.lesions || null;
  S.pet = c.bufs.pet || null;
  if (S.kind === 'ct') { S.vol = c.bufs.ct; S.seq = 'ct'; S.win = 'Soft tissue'; S.hu = m.ct_table; }
  else { S.seq = m.channels[0]; S.vol = c.bufs[S.seq]; S.win = Object.keys(BYTE_WIN[S.sid][S.seq])[0]; }
  // start position
  let start = null;
  if (S.entry.focus) start = S.byId[S.entry.focus];
  else if (S.sid === 'brain') start = S.structs.find((s) => s.name === 'Hippocampus' && s.hemi === 'L');
  else if (S.sid === 'ct_neg') start = S.structs.find((s) => s.raw === 'liver');
  else if (S.sid === 'prostate') start = S.byId[1];
  if (S.hasPet && m.lesions && m.lesions.length) { S.pos = m.lesions[0].center.slice(); S.lesionSel = m.lesions[0].id; }
  else if (start) { S.pos = start.center.slice(); S.selected = start.id; }
  else S.pos = S.dims.map((d) => Math.floor(d / 2));
  $('#loading').remove();
  if (S.kind === 'us') { $('.index').hidden = true; $('.layout').classList.add('noindex'); }
  buildToolbar(S); buildList(S); renderCard(S); setupPanes(S); setupPane4(S);
  S.ro = new ResizeObserver(() => renderAll(S)); S.ro.observe($('.films'));
  renderAll(S);
}

/* ---------- plane geometry (LPS index: i→patient left, j→posterior, k→superior) ---------- */
function planeDefs(S) {
  const [nx, ny, nz] = S.dims, [sx, sy, sz] = S.sp;
  const rad = () => S.conv === 'radio';
  const us = S.kind === 'us';
  return {
    axial: { title: us ? 'C-plane' : 'Axial', axis: 2, w: nx, h: ny, ax: sx, ay: sy,
      toVox: (c, r) => [rad() ? c : nx - 1 - c, r, S.pos[2]], toPix: (v) => [rad() ? v[0] : nx - 1 - v[0], v[1]],
      ori: us ? ['', '', '', ''] : [rad() ? 'R' : 'L', rad() ? 'L' : 'R', 'A', 'P'] },
    coronal: { title: us ? 'Probe plane 1' : 'Coronal', axis: 1, w: nx, h: nz, ax: sx, ay: sz,
      toVox: (c, r) => [rad() ? c : nx - 1 - c, S.pos[1], nz - 1 - r], toPix: (v) => [rad() ? v[0] : nx - 1 - v[0], nz - 1 - v[2]],
      ori: us ? ['', '', '', ''] : [rad() ? 'R' : 'L', rad() ? 'L' : 'R', 'S', 'I'] },
    sagittal: { title: us ? 'Probe plane 2' : 'Sagittal', axis: 0, w: ny, h: nz, ax: sy, ay: sz,
      toVox: (c, r) => [S.pos[0], c, nz - 1 - r], toPix: (v) => [v[1], nz - 1 - v[2]],
      ori: us ? ['', '', '', ''] : ['A', 'P', 'S', 'I'] },
  };
}
const idx3 = (S, x, y, z) => x + S.dims[0] * (y + S.dims[1] * z);
function grayLUT(S) {
  const lut = new Uint8ClampedArray(256);
  if (S.kind === 'ct') {
    const [c, w] = CT_WIN[S.win];
    for (let v = 0; v < 256; v++) lut[v] = ((S.hu[v] - (c - w / 2)) / w) * 255;
  } else {
    const [lo, hi] = BYTE_WIN[S.sid][S.seq][S.win];
    for (let v = 0; v < 256; v++) lut[v] = ((v - lo) / (hi - lo)) * 255;
  }
  return lut;
}
function hot(t) { // black-red-yellow-white
  t = Math.max(0, Math.min(1, t));
  return [Math.min(255, t * 3 * 255), Math.min(255, Math.max(0, t * 3 - 1) * 255), Math.min(255, Math.max(0, t * 3 - 2) * 255)];
}
const HOT = Array.from({ length: 256 }, (_, i) => hot(i / 255));

function renderPlane(S, pane) {
  const P = S.planes[pane.dataset.plane], { w, h } = P;
  let o = pane._off;
  if (!o || o.w !== w || o.h !== h) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    o = pane._off = { c, ctx: c.getContext('2d'), w, h, img: new ImageData(w, h) };
  }
  const data = o.img.data, vol = S.vol, lut = S.lut, labels = S.labels, les = S.lesions, pet = S.pet;
  const a = S.opacity, quizId = S.quiz && !S.quiz.done ? S.quiz.id : null;
  const sel = quizId || S.selected, lsel = S.lesionSel;
  const fusion = S.fusion, petMax = S.sid === 'ct_lym' ? 10 : 8, petScale = S.meta.pet_scale || 0.05;
  const lab = (c, r, arr) => { if (c < 0 || r < 0 || c >= w || r >= h) return -1; const v = P.toVox(c, r); return arr[idx3(S, v[0], v[1], v[2])]; };
  const byId = S.byId, vis = S.visible;
  for (let r = 0; r < h; r++) {
    for (let c = 0; c < w; c++) {
      const v = P.toVox(c, r), i = idx3(S, v[0], v[1], v[2]);
      const g = lut[vol[i]];
      let R = g, G = g, B = g;
      if (labels) {
        const l = labels[i];
        if (l && sel && l === sel) {
          const edge = lab(c - 1, r, labels) !== l || lab(c + 1, r, labels) !== l || lab(c, r - 1, labels) !== l || lab(c, r + 1, labels) !== l;
          if (edge) { R = 255; G = 214; B = 92; }
          else if (!quizId) { const col = byId[l].color, k = Math.max(a, 0.5); R = g * (1 - k) + col[0] * k; G = g * (1 - k) + col[1] * k; B = g * (1 - k) + col[2] * k; }
          else { R = g * 0.55 + 115; G = g * 0.55 + 96; B = g * 0.55 + 41; }
        } else if (l && vis[l] && a > 0 && !quizId) {
          const col = byId[l].color, k = sel ? a * 0.7 : a;
          R = g * (1 - k) + col[0] * k; G = g * (1 - k) + col[1] * k; B = g * (1 - k) + col[2] * k;
        }
      }
      if (pet && fusion > 0) {
        const suv = pet[i] * petScale;
        if (suv > 1.2) {
          const t = Math.min(1, suv / petMax), col = HOT[(t * 255) | 0], k = fusion * Math.min(1, (suv - 1.2) / 2.5);
          R = R * (1 - k) + col[0] * k; G = G * (1 - k) + col[1] * k; B = B * (1 - k) + col[2] * k;
        }
      }
      if (les && S.showLesions) {
        const l = les[i];
        if (l) {
          const edge = lab(c - 1, r, les) !== l || lab(c + 1, r, les) !== l || lab(c, r - 1, les) !== l || lab(c, r + 1, les) !== l;
          if (edge) { if (l === lsel) { R = 255; G = 255; B = 255; } else { R = 54; G = 224; B = 176; } }
        }
      }
      const p = (r * w + c) * 4; data[p] = R; data[p + 1] = G; data[p + 2] = B; data[p + 3] = 255;
    }
  }
  o.ctx.putImageData(o.img, 0, 0);
  const cv = pane.querySelector('canvas'), dpr = window.devicePixelRatio || 1;
  const Wd = Math.round(cv.clientWidth * dpr), Hd = Math.round(cv.clientHeight * dpr);
  if (cv.width !== Wd || cv.height !== Hd) { cv.width = Wd; cv.height = Hd; }
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, Wd, Hd);
  const physW = w * P.ax, physH = h * P.ay;
  const s = Math.min(Wd / physW, Hd / physH) * S.zoom[pane.dataset.plane];
  const dw = physW * s, dh = physH * s;
  const [pc, pr] = P.toPix(S.pos);
  let ox = (Wd - dw) / 2, oy = (Hd - dh) / 2;
  if (S.zoom[pane.dataset.plane] > 1) { // keep the crosshair in view when zoomed
    ox = Wd / 2 - (pc + 0.5) * P.ax * s; oy = Hd / 2 - (pr + 0.5) * P.ay * s;
    ox = Math.min(0, Math.max(Wd - dw, ox)); oy = Math.min(0, Math.max(Hd - dh, oy));
  }
  pane._fit = { sx: (P.ax * s) / dpr, sy: (P.ay * s) / dpr, ox: ox / dpr, oy: oy / dpr };
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(o.c, ox, oy, dw, dh);
  const cx = ox + (pc + 0.5) * P.ax * s, cy = oy + (pr + 0.5) * P.ay * s;
  ctx.strokeStyle = 'rgba(240,169,46,.75)'; ctx.lineWidth = Math.max(1, dpr);
  const gap = 9 * dpr;
  ctx.beginPath();
  ctx.moveTo(ox, cy); ctx.lineTo(cx - gap, cy); ctx.moveTo(cx + gap, cy); ctx.lineTo(ox + dw, cy);
  ctx.moveTo(cx, oy); ctx.lineTo(cx, cy - gap); ctx.moveTo(cx, cy + gap); ctx.lineTo(cx, oy + dh);
  ctx.stroke();
  pane.querySelector('.tag.tl').textContent = P.title;
  pane.querySelector('.tag.br').textContent = sliceLabel(S, P.axis);
  const [l, rr, t, b] = P.ori;
  pane.querySelector('.ori.l').textContent = l; pane.querySelector('.ori.r').textContent = rr;
  pane.querySelector('.ori.t').textContent = t; pane.querySelector('.ori.b').textContent = b;
}
function worldMM(S, v) {
  const m = S.meta;
  if (m.coords === 'mni') { const [nx, ny] = m.mni_dims; return [m.mni_origin[0] + (nx - 1 - v[0]), m.mni_origin[1] + (ny - 1 - v[1]), m.mni_origin[2] + v[2]]; }
  return v.map((a, i) => m.origin[i] + a * S.sp[i]);
}
function sliceLabel(S, axis) {
  if (S.kind === 'us') return 'slice ' + (S.pos[axis] + 1) + ' / ' + S.dims[axis];
  const mm = worldMM(S, S.pos)[axis];
  return 'xyz'[axis] + ' = ' + Math.round(mm) + ' mm';
}
function renderAll(S) {
  if (!S || S.disposed || !S.vol || S.raf) return;
  S.raf = requestAnimationFrame(() => {
    S.raf = 0; if (S.disposed) return;
    S.planes = planeDefs(S); S.lut = grayLUT(S);
    S.panes.forEach((p) => renderPlane(S, p));
    updateReadout(S); if (S.p4 === 'mip') renderMIP(S); else update3D(S);
  });
}

function setupPanes(S) {
  S.panes = [...document.querySelectorAll('.pane[data-plane]')];
  S.planes = planeDefs(S);
  const tall = (P) => Math.min(6, Math.max(1, (P.h * P.ay) / (P.w * P.ax)));
  S.zoom = { axial: 1, coronal: tall(S.planes.coronal) > 1.6 ? tall(S.planes.coronal) : 1, sagittal: tall(S.planes.sagittal) > 1.6 ? Math.min(tall(S.planes.sagittal), tall(S.planes.coronal) * 1.2) : 1 };
  S.zoom0 = { ...S.zoom };
  S.panes.forEach((pane) => {
    const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; pane.appendChild(tip);
    let drag = false;
    const voxAt = (ev) => {
      const r = pane.getBoundingClientRect(), f = pane._fit; if (!f) return null;
      const P = S.planes[pane.dataset.plane];
      const c = Math.floor((ev.clientX - r.left - f.ox) / f.sx), rr = Math.floor((ev.clientY - r.top - f.oy) / f.sy);
      if (c < 0 || rr < 0 || c >= P.w || rr >= P.h) return null;
      return P.toVox(c, rr);
    };
    const move = (e) => {
      const v = voxAt(e); if (!v) return;
      S.pos = v;
      if (e.type === 'pointerdown' && !(S.quiz && !S.quiz.done)) {
        const i = idx3(S, v[0], v[1], v[2]);
        if (S.lesions && S.showLesions && S.lesions[i]) { S.lesionSel = S.lesions[i]; S.selected = null; renderCard(S); syncLesionRows(S); }
        else if (S.labels && S.labels[i] && S.visible[S.labels[i]]) select(S, S.labels[i], false);
      }
      renderAll(S);
    };
    pane.addEventListener('pointerdown', (e) => { drag = true; pane.setPointerCapture(e.pointerId); move(e); });
    pane.addEventListener('pointerup', () => { drag = false; });
    pane.addEventListener('pointercancel', () => { drag = false; });
    pane.addEventListener('pointerleave', () => { tip.hidden = true; S.hovered = null; updateReadout(S); });
    pane.addEventListener('pointermove', (e) => {
      if (drag) move(e);
      const v = voxAt(e); if (!v) { tip.hidden = true; return; }
      S.hovered = v; updateReadout(S);
      const i = idx3(S, v[0], v[1], v[2]);
      let text = '';
      if (S.lesions && S.showLesions && S.lesions[i]) text = 'Lesion ' + (S.lesions[i] === 61 ? '(small)' : S.lesions[i]);
      else if (S.labels && S.labels[i] && !(S.quiz && !S.quiz.done)) { const st = S.byId[S.labels[i]]; if (st) text = st.name + (st.hemi !== 'M' ? ' · ' + st.hemi : ''); }
      if (text && e.pointerType === 'mouse') {
        tip.textContent = text;
        const r = pane.getBoundingClientRect(); tip.style.left = (e.clientX - r.left) + 'px'; tip.style.top = (e.clientY - r.top) + 'px';
        tip.style.transform = e.clientX - r.left > r.width * 0.6 ? 'translate(calc(-100% - 12px), 12px)' : '';
        tip.hidden = false;
      } else tip.hidden = true;
    });
    pane.addEventListener('wheel', (e) => {
      e.preventDefault();
      const ax = S.planes[pane.dataset.plane].axis;
      if (e.ctrlKey || e.metaKey) { const k = pane.dataset.plane; S.zoom[k] = Math.max(1, Math.min(6, S.zoom[k] * (e.deltaY > 0 ? 0.9 : 1.1))); }
      else S.pos[ax] = Math.max(0, Math.min(S.dims[ax] - 1, S.pos[ax] + (e.deltaY > 0 ? -1 : 1)));
      renderAll(S);
    }, { passive: false });
    pane.addEventListener('dblclick', () => { const k = pane.dataset.plane; S.zoom[k] = S.zoom[k] > 1 ? 1 : Math.max(2.5, S.zoom0[k]); renderAll(S); });
    pane.tabIndex = 0;
    pane.addEventListener('keydown', (e) => {
      const ax = S.planes[pane.dataset.plane].axis;
      if (e.key === 'ArrowUp' || e.key === 'PageUp') S.pos[ax] = Math.min(S.dims[ax] - 1, S.pos[ax] + 1);
      else if (e.key === 'ArrowDown' || e.key === 'PageDown') S.pos[ax] = Math.max(0, S.pos[ax] - 1);
      else return;
      e.preventDefault(); renderAll(S);
    });
  });
  $('.hint').textContent = 'Click or drag to move the crosshair. Scroll to page through slices; Ctrl + scroll or double-click to zoom. Hover to read a label.';
}

/* ---------- toolbar ---------- */
function segHTML(id, opts, cur) { return `<div class="seg" id="${id}">${opts.map((o) => `<button type="button" data-v="${esc(o)}" aria-pressed="${o === cur}">${esc(o)}</button>`).join('')}</div>`; }
function buildToolbar(S) {
  const tb = $('#tb'); let h = '';
  if (S.kind === 'mr' && S.meta.channels.length > 1) h += `<div class="tgroup"><span class="tlabel">Sequence</span>${segHTML('t-seq', S.meta.channels.map((c) => c.toUpperCase()), S.seq.toUpperCase())}</div>`;
  const wins = S.kind === 'ct' ? Object.keys(CT_WIN) : Object.keys(BYTE_WIN[S.sid][S.seq]);
  h += `<div class="tgroup"><span class="tlabel">${S.kind === 'us' ? 'Gain' : 'Window'}</span>${segHTML('t-win', wins, S.win)}</div>`;
  if (S.meta.regions && S.meta.regions.length) h += `<div class="tgroup"><span class="tlabel">Go to</span><div class="seg" id="t-reg">${S.meta.regions.map((r, i) => `<button type="button" data-i="${i}" aria-pressed="false">${esc(r.name)}</button>`).join('')}</div></div>`;
  if (S.labels) h += `<div class="tgroup"><label class="tlabel" for="t-op">Labels</label><input id="t-op" type="range" min="0" max="100" value="${S.opacity * 100}"></div>`;
  if (S.hasPet) h += `<div class="tgroup"><label class="tlabel" for="t-pet">PET</label><input id="t-pet" type="range" min="0" max="100" value="${S.fusion * 100}"><label class="check"><input type="checkbox" id="t-les" checked> Lesion outlines</label></div>`;
  if (S.kind !== 'us') h += `<div class="tgroup"><span class="tlabel">Display</span>${segHTML('t-conv', ['Radiological', 'Neurological'], 'Radiological')}</div>`;
  if (S.labels && S.structs.length > 4) h += `<button type="button" class="btn primary" id="t-quiz">Quiz me</button>`;
  tb.innerHTML = h;
  const seg = (id, fn) => { const el = $('#' + id); if (!el) return; el.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; el.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); fn(b); renderAll(S); }); };
  seg('t-seq', (b) => { S.seq = b.dataset.v.toLowerCase(); S.vol = S.c.bufs[S.seq]; S.win = Object.keys(BYTE_WIN[S.sid][S.seq]).find((k) => k === S.win) || Object.keys(BYTE_WIN[S.sid][S.seq])[0]; });
  seg('t-win', (b) => { S.win = b.dataset.v; });
  seg('t-conv', (b) => { S.conv = b.dataset.v === 'Radiological' ? 'radio' : 'neuro'; });
  seg('t-reg', (b) => {
    const r = S.meta.regions[+b.dataset.i]; S.pos[2] = Math.round((r.k0 + r.k1) / 2);
    if (r.name === 'Thorax' && S.kind === 'ct') { S.win = 'Lung'; syncSeg('t-win', 'Lung'); } else if (S.win === 'Lung') { S.win = 'Soft tissue'; syncSeg('t-win', 'Soft tissue'); }
    setTimeout(() => b.setAttribute('aria-pressed', 'false'), 400);
  });
  const op = $('#t-op'); if (op) op.addEventListener('input', () => { S.opacity = op.value / 100; renderAll(S); });
  const pet = $('#t-pet'); if (pet) pet.addEventListener('input', () => { S.fusion = pet.value / 100; renderAll(S); });
  const les = $('#t-les'); if (les) les.addEventListener('change', () => { S.showLesions = les.checked; renderAll(S); });

function update3D(S) {

}

      <div class="tgroup"><label class="tlabel" for="x-op">Labels</label><input id="x-op" type="range" min="0" max="100" value="0"></div>
    </div>
    <div class="layout">
      <nav class="index" aria-label="Structures"><input type="search" id="search" placeholder="Find a structure…" aria-label="Find a structure"><div class="list" id="list"></div></nav>
      <section aria-label="Radiograph"><div class="films single"><div class="pane" id="xpane"><canvas></canvas><span class="tag tl" id="xtitle"></span><span class="ori l" id="xl"></span><span class="ori r" id="xr"></span><div class="loading" id="loading">Loading…</div></div></div>
        <p class="hint">Hover to name the structure that dominates each ray. Click to select it; its projected outline is drawn in yellow.</p></section>
      <aside class="card" id="card" aria-live="polite"></aside>
    </div>`;
  $('#back').addEventListener('click', goHome);
  const X = W = { entry, view: 'ap', region: 'Chest', opacity: 0, selected: null, disposed: false, visible: new Uint8Array(256), dispose() { this.disposed = true; if (this.ro) this.ro.disconnect(); } };
  loadStudy('ct_neg', ['xr_ap', 'xr_lat', 'xr_ap_lab', 'xr_lat_lab'], (d, n) => { const l = $('#loading'); if (l) l.textContent = `Loading… ${d} of ${n}`; })
    .then((c) => { if (!X.disposed) startXray(X, c); })

function startXray(X, c) {
